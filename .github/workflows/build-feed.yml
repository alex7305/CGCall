name: build-feed
on:
  push:
    paths: ["companion/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --name cgcall_feed companion/cgcall_feed.py
      - uses: actions/upload-artifact@v4
        with:
          name: cgcall_feed
          path: dist/cgcall_feed.exe
